<!doctype html><html lang="zh-Hant" data-theme="blue"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><base href="../../../"><title>討伐小劇場｜演出驗收</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/mobile.css"><link rel="stylesheet" href="css/companion.css"><link rel="stylesheet" href="css/battle-theater.css"><link rel="stylesheet" href="css/themes.css"><link rel="stylesheet" href="css/light-theme.css"><style>body{padding:24px;background:var(--t-bg);color:var(--t-text)}main{max-width:480px;margin:40px auto}h1{font-size:26px}main p{color:var(--t-muted)}main button{display:block;width:100%;margin:12px 0;min-height:48px;border-radius:12px;border:1px solid var(--t-line);background:var(--t-raised);color:var(--t-text)}#battle-result-details h2{font-size:24px}</style></head><body><main><small>BATTLE STORY PREVIEW</small><h1>她們的冒險，回來說給你聽。</h1><p>現有角色、敵人與羈絆合照的小劇場。這是獨立演出示範，不讀寫遊戲存檔，也不發放獎勵。</p><button id="play-heroes" type="button">勇者隊 × 焦糖大王</button><button id="play-solo" type="button">原味小湘的撤退示範</button><button id="theme" type="button">切換深色／淺色</button><p>可暫停、下一幕、跳過和重播。系統開啟減少動態時，改為手動靜態分鏡。</p></main><dialog class="residents-dialog sheet battle-result" id="battle-result" aria-labelledby="battle-result-title"><section id="battle-theater" class="battle-theater" hidden></section><div id="battle-result-details"><button class="battle-replay" id="battle-replay" type="button">重播小劇場 ↻</button><h2 id="battle-result-title"></h2><p id="demo-stars"></p><ol class="battle-log" id="demo-line" aria-label="戰報故事"></ol><p>這是展示用戰報，不發放獎勵。</p><button class="btn" id="demo-close" type="button">返回示範選單</button></div></dialog><script type="module">
import {renderBattleLog} from './js/battle-log.js';
import {createBattleTheater} from './js/battle-theater.js';
import * as battle from './js/battle.js';
import { LEVELS } from './js/affection.js';
const $=id=>document.getElementById(id),dialog=$('battle-result');const theater=createBattleTheater({root:$('battle-theater'),details:$('battle-result-details'),dialog,replay:$('battle-replay')});
function play(hero){const s={dex:Object.fromEntries(['001','062','063','064'].map(no=>[no,{at:'demo'}])),affection:hero?Object.fromEntries(['062','063','064'].map(no=>[no,{pts:LEVELS[LEVELS.length-1]}])):{},energy:0,fossils:0,wishEgg:{stock:0},battle:{stages:{mochi:{clears:1},sock:{clears:1},bento:{clears:1}}}};const trip=battle.startBattle(s,'caramel-king',hero?['062','063','064']:['001'],{now:new Date(Date.now()-3*3600000),rand:()=>.5});const r=battle.collectBattle(s,trip.id,new Date(),()=>.5),e=battle.ENEMIES['caramel-king'];$('battle-result-title').textContent=r.report.win?'討伐成功！':'先撤退了……';$('demo-stars').textContent=r.report.win?'★'.repeat(r.report.stars):'休息好了，再一起挑戰。';renderBattleLog($('demo-line'),r.report.log);dialog.showModal();theater.play({report:r.report,nos:r.nos,enemy:e,scene:new URL('assets/places/conv.webp',document.baseURI).href,bondUnlocked:hero});}
$('play-heroes').onclick=()=>play(true);$('play-solo').onclick=()=>play(false);$('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='blue'?'sakura':'blue';$('demo-close').onclick=()=>dialog.close();
</script></body></html>
