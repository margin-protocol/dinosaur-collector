<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d10">
<title>小湘收集器 SIANG COLLECTOR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header__brand">SIANG COLLECTOR</div>
    <h1 class="header__title" id="page-title">培育槽 01</h1>
    <div class="rule" aria-hidden="true"><span class="gem"></span></div>
  </header>

  <main class="view" data-view="home">
    <div class="stage">
      <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="stage__tag" id="egg-name"></div>
      <div id="stage-egg"></div>
      <p class="stage__empty" id="stage-empty">培育槽是空的，下一顆蛋還在準備中。</p>
      <!-- 預留位置：小湘與小恐龍的正式素材到了再顯示 -->
      <img class="stage__slot stage__slot--character" id="slot-character" alt="" hidden>
      <img class="stage__slot stage__slot--mascot" id="slot-mascot" alt="" hidden>
    </div>
    <section class="vitals" id="vitals" aria-live="polite">
      <div class="vitals__row">
        <span class="vitals__label"><span class="gem" aria-hidden="true"></span>生命訊號</span>
        <span class="vitals__value" id="vitals-value">0 / 100</span>
      </div>
      <div class="vial" aria-hidden="true">
        <span class="vial__cap"></span>
        <div class="vial__tube"><div class="vial__fill" id="vitals-fill"></div></div>
        <span class="vial__cap"></span>
      </div>
      <p class="vitals__msg" id="vitals-msg"></p>
    </section>
    <button class="btn" id="warm-btn" type="button"><span class="gem" aria-hidden="true"></span><span id="warm-label">幫蛋保溫</span><span class="gem" aria-hidden="true"></span></button>
  </main>

  <main class="view" data-view="dex" hidden>
    <p class="dex__count" id="dex-count"></p>
    <ul class="dex__grid" id="dex-grid"></ul>
    <div style="margin-top: auto; text-align: center">
      <button class="btn btn--quiet" id="reset-btn" type="button">重置進度（測試用）</button>
    </div>
  </main>

  <nav class="nav" id="nav" aria-label="主要分頁">
    <button class="nav__item" type="button" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 0 6 6 6 10a6 6 0 0 1-12 0c0-4 2.500-10 6-10z"/></svg>培育
    </button>
    <button class="nav__item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>任務
    </button>
    <button class="nav__item" type="button" data-view="dex">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>圖鑑
    </button>
    <button class="nav__item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3v6l-5 10a1.500 1.500 0 0 0 1.300 2h11.400a1.500 1.500 0 0 0 1.300-2L14 9V3M8 3h8"/></svg>研究
    </button>
    <button class="nav__item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v13H4zM4 10h16M9 6V4h6v2"/></svg>記憶
    </button>
  </nav>
</div>

<dialog class="sheet sheet--letter" id="intro" aria-label="小湘留下的紙條">
  <div class="sheet__seal" aria-hidden="true"><span class="gem"></span></div>
  <p class="sheet__note">致親愛的飼養員：

這顆蛋就交給你了。
聽說只要好好照顧它，
就會孵出一個很可愛的東西。

—— 小湘 ♡</p>
  <button class="btn" id="intro-ok" type="button">收下這顆蛋</button>
</dialog>

<dialog class="sheet" id="reveal" aria-label="孵化結果">
  <img class="sheet__img" id="reveal-img" alt="">
  <div class="sheet__no" id="reveal-no"></div>
  <h2 class="sheet__name" id="reveal-name"></h2>
  <p class="sheet__line" id="reveal-line"></p>
  <button class="btn" id="reveal-ok" type="button">收進圖鑑</button>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
