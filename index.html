<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d10">
<title>小湘收集器 SIANG COLLECTOR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<div class="app">
  <!-- 資源列：所有分頁都看得到 -->
  <div class="topbar">
    <div class="chip" id="chip-energy" title="保溫能量">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 5.500 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>
      <span class="chip__k">能量</span><span class="chip__v" id="energy-value">0</span>
    </div>
    <div class="chip" id="chip-fossil" title="化石碎片">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 6-3 11H8L5 9zM5 9h14M12 3v17"/></svg>
      <span class="chip__k">化石</span><span class="chip__v" id="fossil-value">0</span>
    </div>
    <div class="topbar__brand">SIANG COLLECTOR</div>
  </div>

  <header class="header" id="header">
    <h1 class="header__title" id="page-title"></h1>
    <div class="rule" aria-hidden="true"><span class="gem"></span></div>
  </header>

  <main class="view view--home" data-view="home">
    <div class="stage">
      <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="tag" id="egg-tag">
        <span class="tag__code" id="egg-code"></span>
        <span class="tag__name" id="egg-name"></span>
      </div>

      <div class="side">
        <button class="fab" type="button" id="fab-wish" aria-label="願望">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.600 5.600 6 .700-4.500 4.100 1.300 6-5.400-3.100-5.400 3.100 1.300-6L3.400 9.300l6-.700z"/></svg>
          <span class="fab__label">願望</span>
          <span class="dot" id="wish-dot" hidden></span>
        </button>
        <button class="fab" type="button" id="fab-letter" aria-label="小湘的紙條">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zM3 7l9 7 9-7"/></svg>
          <span class="fab__label">紙條</span>
        </button>
      </div>

      <div id="stage-egg"></div>

      <!-- 小恐龍：站在培養架左邊，用對話泡泡告訴玩家現在該做什麼 -->
      <button class="guide" type="button" id="bubble">
        <span class="bubble">
          <span class="bubble__who">小恐龍</span>
          <span class="bubble__text" id="bubble-text"></span>
        </span>
        <img class="mascot" src="assets/mascot/dinosaur-idle.webp" alt="" width="512" height="512">
      </button>
      <span class="float-gain" id="float-gain" aria-hidden="true"></span>
      <button class="hint" type="button" id="hint"></button>
    </div>

    <section class="panel vitals" id="vitals">
      <div class="vitals__row">
        <span class="vitals__label"><span class="gem" aria-hidden="true"></span>生命訊號<span class="en">VITAL SIGN</span></span>
        <span class="vitals__value"><span id="vitals-value">000</span><span class="vitals__max" id="vitals-max">/100</span></span>
      </div>
      <div class="vitals__meter" aria-hidden="true">
        <div class="vial">
          <span class="vial__cap"></span>
          <div class="vial__tube"><div class="vial__fill" id="vitals-fill"></div></div>
          <span class="vial__cap"></span>
        </div>
        <div class="ecg">
          <svg class="ecg__line" viewBox="0 0 400 40" preserveAspectRatio="none">
            <path d="M0 22 H40 L46 22 L50 16 L54 22 L60 22 L64 26 L70 4 L76 36 L82 22 L90 22 L96 18 L104 22 H200 H240 L246 22 L250 16 L254 22 L260 22 L264 26 L270 4 L276 36 L282 22 L290 22 L296 18 L304 22 H400"/>
          </svg>
          <span class="ecg__bpm"><span id="ecg-bpm">48</span> BPM</span>
        </div>
      </div>
    </section>
  </main>

  <main class="view" data-view="wish" hidden>
    <p class="lead" id="wish-lead"></p>
    <ul class="wishes" id="wish-list"></ul>
    <p class="fine">拍照後，程式會在手機上分析照片的顏色。照片不會上傳，也不會保存。<br>每天會換三個新的願望。</p>
  </main>

  <main class="view" data-view="dex" hidden>
    <p class="dex__count" id="dex-count"></p>
    <ul class="dex__grid" id="dex-grid"></ul>
    <div style="margin-top: auto; text-align: center">
      <button class="btn btn--quiet" id="reset-btn" type="button">重置進度（測試用）</button>
    </div>
  </main>

  <nav class="nav" id="nav" aria-label="主要分頁">
    <button class="nav__item" type="button" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.500 0 6 6 6 10a6 6 0 0 1-12 0c0-4 2.500-10 6-10z"/></svg>培育
    </button>
    <button class="nav__item" type="button" data-view="wish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.600 5.600 6 .700-4.500 4.100 1.300 6-5.400-3.100-5.400 3.100 1.300-6L3.400 9.300l6-.700z"/></svg>願望
      <span class="dot" id="nav-wish-dot" hidden></span>
    </button>
    <button class="nav__item" type="button" data-view="dex">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>圖鑑
    </button>
    <button class="nav__item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3v6l-5 10a1.500 1.500 0 0 0 1.300 2h11.400a1.500 1.500 0 0 0 1.300-2L14 9V3M8 3h8"/></svg>研究
    </button>
    <button class="nav__item" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v13H4zM4 10h16M9 6V4h6v2"/></svg>記憶
    </button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet sheet--letter" id="intro" aria-label="小湘留下的紙條">
  <div class="sheet__seal" aria-hidden="true"><span class="gem"></span></div>
  <p class="sheet__note">致親愛的飼養員：

這顆蛋就交給你了。
聽說只要好好照顧它，
就會孵出一個很可愛的東西。

—— 小湘 ♡</p>
  <button class="btn" id="intro-ok" type="button">收下這顆蛋</button>
</dialog>

<dialog class="sheet" id="photo" aria-label="照片分析結果">
  <div class="sheet__en">COLOR ANALYSIS</div>
  <canvas class="photo__thumb" id="photo-thumb" width="320" height="320"></canvas>
  <div class="photo__meter"><div class="photo__fill" id="photo-fill"></div><span class="photo__mark"></span></div>
  <h2 class="sheet__name" id="photo-title"></h2>
  <p class="sheet__line" id="photo-text"></p>
  <button class="btn" id="photo-ok" type="button">好</button>
</dialog>

<div class="analysis" id="analysis" hidden aria-live="assertive">
  <div class="analysis__grid" aria-hidden="true"></div>
  <div class="analysis__scan" aria-hidden="true"></div>
  <div class="analysis__box">
    <div class="analysis__en">LIFEFORM ANALYSIS</div>
    <div class="analysis__title">生命體分析中</div>
    <div class="analysis__bar"><div class="analysis__fill" id="analysis-fill"></div></div>
    <div class="analysis__pct" id="analysis-pct">000%</div>
  </div>
</div>

<dialog class="sheet sheet--reveal" id="reveal" aria-label="孵化結果">
  <div class="sheet__en" id="reveal-en">NEW SPECIMEN REGISTERED</div>
  <img class="sheet__img" id="reveal-img" alt="">
  <div class="sheet__no" id="reveal-no"></div>
  <h2 class="sheet__name" id="reveal-name"></h2>
  <p class="sheet__line" id="reveal-line"></p>
  <p class="sheet__bonus" id="reveal-bonus" hidden></p>
  <button class="btn" id="reveal-ok" type="button">收進圖鑑</button>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
