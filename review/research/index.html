<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171722">
<title>小湘｜研究室介面預覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/app.css"><link rel="stylesheet" href="../../css/mobile.css"><link rel="stylesheet" href="../../css/lobby.css"><link rel="stylesheet" href="../../css/companion.css"><link rel="stylesheet" href="../../css/hatching.css"><link rel="stylesheet" href="../../css/research.css">
<style>
body{background:#171722}main{max-width:440px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(24px,env(safe-area-inset-left))}.demo-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.demo-nav a{display:flex;align-items:center;min-height:44px;font:12px var(--font-display);text-decoration:none;color:var(--pearl)}.demo-nav select{min-height:44px;max-width:155px;padding:8px;border:1px solid #9a82a955;border-radius:8px;background:#2d2637;color:var(--ivory);font:11px var(--font-display)}.demo-note{color:var(--silver);font:10px/1.8 var(--font-display);margin:10px 0 0}
</style>
<body data-view="research"><main><div class="demo-nav"><a href="../../">‹ 返回小湘的日常</a><select id="demo-mode" aria-label="示範收藏狀態"><option value="full">示範：已收集三位</option><option value="locked">示範：尚未解鎖</option></select></div><p class="demo-note">使用獨立示範收藏，不讀取或修改你的遊戲進度。</p><section id="demo-research" class="view--research"></section></main>
<script type="module">
import {createResearch} from '../../js/research.js';
let demo={dex:{'001':{at:'demo'},'002':{at:'demo'},'005':{at:'demo'}}};
const view=createResearch({root:document.getElementById('demo-research'),getState:()=>demo,onCollect:()=>location.href='../../#incubate'});
document.getElementById('demo-mode').onchange=event=>{demo={dex:event.target.value==='full'?{'001':{at:'demo'},'002':{at:'demo'},'005':{at:'demo'}}:{'001':{at:'demo'}}};view.update()};
</script>
</body></html>
